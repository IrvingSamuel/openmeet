openapi: 3.0.3
info:
  title: API pública — Salas e reuniões
  version: 3.2.1
  description: |
    API para plataformas terceirizadas criarem **salas-template** (personalização reutilizável)
    e **reuniões** (sessões com URL de entrada `/m/{slug}`).

    ## Fluxos

    1. **Sala padrão** — `POST /api/v1/rooms`  
       Cria um template de marca. O `name` identifica a sala; a personalização
       (identidade, paleta, avançado) é opcional e usa defaults da plataforma
       quando omitida.

    2. **Reunião a partir de sala** — `POST /api/v1/rooms/{room_id}/meetings`  
       Cria uma reunião com o título fornecido e snapshot da marca da sala.

    3. **Reunião instantânea** — `POST /api/v1/instant-meetings`  
       Cria uma reunião sem sala. Campos de identidade/paleta/avançado são
       opcionais (default = UI predefinida do owner ou tema da plataforma).

    4. **Integração LMS/CRM (privada + retorno)**  
       - Crie com `access_policy: invite` (ativa `wait_for_host` por omissão).  
       - Partilhe `url` com participantes (ficam na sala de espera até o anfitrião).  
       - Redirecione o anfitrião para `host_url` (concede privilégios de host sem login).  
       - Após leave/end, participantes regressam a `redirect_after_meet`.  
       - Informe `webhook_url` para receber resumo, transcrição, tarefas e gravação.

    ## Webhooks de saída (webhook_url)

    Campo opcional em salas e reuniões: URL **http(s) absoluta** para onde o
    OpenMeet envia os artefatos da reunião. **Não** é redirect de browser —
    isso continua a ser `redirect_after_meet`.

    - **Sala** — default para reuniões criadas a partir desse template.
    - **Reunião** — override. Se omitido em `POST /api/v1/rooms/{room_id}/meetings`,
      herda o da sala (snapshot na criação; alterar a sala depois não muda
      reuniões já criadas). Enviar `null` ou `""` cria a reunião sem webhook.
    - O envio para a URL da reunião **não depende** do webhook global do Admin.
      Se o webhook Admin estiver ativo e a URL for diferente, os eventos também
      são enviados para lá.

    Cada artefato gera um POST JSON próprio (a gravação fica pronta depois do
    resumo):

    - `transcript.ready` — transcrição completa (`data.segments`)
    - `chat.ready` — mensagens do chat da reunião
    - `attendance.ready` — lista de presença (`data.attendees`, nomes + entrada/saída)
    - `summary.ready` — resumo em Markdown (`data.summaryMarkdown`)
    - `tasks.generated` — tarefas extraídas (`data.tasks`)
    - `recording.ready` — metadados da gravação + `data.downloadPath`
      (`GET` com Bearer da API ou sessão do host/owner; `?download=1` força
      `Content-Disposition: attachment`)

    Envelope comum: `{ event, version: 1, sentAt, meeting, data }`.

    Headers: `Content-Type: application/json`, `X-OpenMeet-Event`,
    `X-OpenMeet-Timestamp`, `X-OpenMeet-Signature` (HMAC-SHA256 do
    `{timestamp}.{body}` com o secret global do Admin, se configurado),
    `User-Agent: OpenMeet-Webhooks/1.0`.

    ## Autenticação

    Bearer token obrigatório (`Authorization: Bearer …`), gerado em
    **Admin → API** (ou `MEET_MCP_TOKEN` no ambiente, em transição).

    Se o body omitir o owner, o token de plataforma usa o admin que o gerou
    como owner por omissão. Caso contrário envie `owner_identity_id` ou
    `external_id`.
servers:
  - url: https://meet.example.com
    description: This deployment (rewritten at runtime from NEXT_PUBLIC_APP_URL)
paths:
  /api/v1/rooms:
    post:
      operationId: createRoom
      summary: Criar sala padrão (template de personalização)
      description: |
        Cria uma sala-template em `/r/{slug}`. **Não cria reunião.**

        O campo `name` serve apenas para identificar o template. O título que
        aparece na reunião deve ser definido depois em
        `POST /api/v1/rooms/{room_id}/meetings`.

        Grupos `identity`, `palette` e `advanced` são opcionais. Campos omitidos
        usam o padrão da plataforma (`theme_preset: sky`, wordmark/lobby a partir
        de `name`, subtítulo "Powered by OpenMeet").
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            examples:
              minimal:
                summary: Só o nome (tema padrão da plataforma)
                value:
                  name: Template Acme
                  external_id: "partner-user-123"
              withWebhook:
                summary: Nome + destino dos artefatos da reunião
                value:
                  name: Template Acme
                  external_id: "partner-user-123"
                  webhook_url: "https://lms.example.com/hooks/openmeet"
              fullBrand:
                summary: Identidade + paleta + avançado
                value:
                  name: Template Acme
                  external_id: "partner-user-123"
                  access_policy: public
                  identity:
                    logo_url: "https://cdn.example.com/logo.png"
                    wordmark: Acme
                    lobby_subtitle: Reuniões Acme
                  palette:
                    theme_preset: emerald
                    bg_animation: aurora
                    bg_animation_speed: 4
                  advanced:
                    font_family: "Inter, system-ui, sans-serif"
      responses:
        "201":
          description: Sala-template criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoomResponse"
              example:
                room_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: Template Acme
                slug: "x7k9m2pqab"
                url: "https://openmeet.chronos.com.pt/r/x7k9m2pqab"
                join_path: "/r/x7k9m2pqab"
                access_policy: public
                webhook_url: null
                brand:
                  identity:
                    lobby_title: Template Acme
                    lobby_subtitle: Powered by OpenMeet
                    logo_url: null
                    wordmark: Template Acme
                  palette:
                    theme_preset: sky
                    primary_color: "#0ea5e9"
                    secondary_color: "#38bdf8"
                    tertiary_color: "#818cf8"
                    background: "#0b1020"
                  advanced:
                    font_family: "Inter, system-ui, sans-serif"
                    favicon_url: null
                    custom_css: null
        "400":
          description: Corpo inválido ou falha ao resolver owner
        "401":
          description: Autenticação em falta ou inválida

  /api/v1/rooms/{room_id}/meetings:
    post:
      operationId: createMeetingFromRoom
      summary: Criar reunião a partir de sala predefinida
      description: |
        Cria uma reunião independente (`/m/{slug}`) usando a marca da sala como
        snapshot. O **título da reunião é obrigatório** e vem da plataforma
        terceirizada — não usa o `name` da sala.

        Sem override de personalização neste endpoint (a marca vem da sala).
      security:
        - bearerAuth: []
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da sala-template criada em POST /api/v1/rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingFromRoomRequest"
            examples:
              basic:
                summary: Título obrigatório
                value:
                  title: Comercial 8 set
              withWebhook:
                summary: Título + webhook da reunião (override da sala)
                value:
                  title: Comercial 8 set
                  webhook_url: "https://crm.example.com/hooks/meetings/comercial"
              withTimeout:
                summary: Título + timeout
                value:
                  title: Kickoff parceiro
                  access_policy: public
                  empty_timeout_sec: 300
      responses:
        "201":
          description: Reunião criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMeetingResponse"
              example:
                meeting_id: "8c3e2a1b-5717-4562-b3fc-2c963f66afa6"
                slug: "m7k9m2pqab"
                url: "https://openmeet.chronos.com.pt/m/m7k9m2pqab"
                join_path: "/m/m7k9m2pqab"
                host_url: "https://openmeet.chronos.com.pt/api/v1/meetings/8c3e2a1b-5717-4562-b3fc-2c963f66afa6/enter?token=…"
                host_path: "/api/v1/meetings/8c3e2a1b-5717-4562-b3fc-2c963f66afa6/enter?token=…"
                access_policy: public
                title: Comercial 8 set
                brand_room_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                empty_timeout_sec: 300
                redirect_after_meet: null
                external_invite_url: null
                webhook_url: null
                wait_for_host: false
        "400":
          description: Corpo inválido (ex. title em falta)
        "401":
          description: Autenticação em falta ou inválida
        "404":
          description: Sala não encontrada

  /api/v1/instant-meetings:
    post:
      operationId: createInstantMeeting
      summary: Criar reunião instantânea
      description: |
        Cria uma reunião com URL própria (`/m/{slug}`). **Não cria sala.**

        Personalização opcional via `identity`, `palette` e `advanced`.
        Campos omitidos usam a UI predefinida do owner (se existir) ou o tema
        padrão da plataforma (`sky`).

        O campo legado `ui` (camelCase) continua aceite por compatibilidade.
        Para reutilizar uma sala já criada, prefira
        `POST /api/v1/rooms/{room_id}/meetings`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstantMeetingRequest"
            examples:
              minimal:
                summary: Mínimo (UI predefinida / tema plataforma)
                value:
                  title: Quick sync
                  external_id: "partner-user-123"
              withGroups:
                summary: Com identidade, paleta e avançado
                value:
                  title: Partner kickoff
                  access_policy: public
                  external_id: "partner-user-123"
                  identity:
                    lobby_title: Acme Kickoff
                    wordmark: Acme
                  palette:
                    theme_preset: emerald
                    primary_color: "#10b981"
                    bg_animation: wave
                  advanced:
                    font_family: "Inter, system-ui, sans-serif"
              legacyUi:
                summary: Alias legado ui (camelCase)
                value:
                  title: Partner kickoff
                  external_id: "partner-user-123"
                  ui:
                    lobbyTitle: Acme Kickoff
                    themePreset: emerald
              privateWithReturn:
                summary: Privada com espera do host e redirect pós-meet
                value:
                  title: Aula 12
                  access_policy: invite
                  external_id: "teacher-42"
                  redirect_after_meet: "https://lms.example.com/classes/12"
                  external_invite_url: "https://lms.example.com/classes/12/join"
                  webhook_url: "https://lms.example.com/hooks/openmeet"
                  wait_for_host: true
      responses:
        "201":
          description: Reunião instantânea criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMeetingResponse"
              example:
                meeting_id: "8c3e2a1b-5717-4562-b3fc-2c963f66afa6"
                slug: "x7k9m2pqab"
                url: "https://openmeet.chronos.com.pt/m/x7k9m2pqab"
                join_path: "/m/x7k9m2pqab"
                host_url: "https://openmeet.chronos.com.pt/api/v1/meetings/8c3e2a1b-5717-4562-b3fc-2c963f66afa6/enter?token=…"
                host_path: "/api/v1/meetings/8c3e2a1b-5717-4562-b3fc-2c963f66afa6/enter?token=…"
                access_policy: invite
                title: Aula 12
                brand_room_id: null
                empty_timeout_sec: 300
                redirect_after_meet: "https://lms.example.com/classes/12"
                external_invite_url: "https://lms.example.com/classes/12/join"
                webhook_url: "https://lms.example.com/hooks/openmeet"
                wait_for_host: true
        "400":
          description: Corpo inválido ou falha ao resolver owner
        "401":
          description: Autenticação em falta ou inválida
        "404":
          description: room_id (legado) não encontrado

  /api/v1/meetings/{meeting_id}/enter:
    get:
      operationId: enterMeetingAsHost
      summary: Entrada pré-redirect do anfitrião
      description: |
        Endpoint de browser (sem Bearer). Valida o `token` emitido em `host_url`
        na criação da reunião, grava um cookie httpOnly de anfitrião e redireciona
        (302) para `/m/{slug}` com privilégios de host (encerrar reunião, etc.).

        Use este link para o utilizador que deve entrar como anfitrião a partir
        da plataforma terceirizada.
      parameters:
        - name: meeting_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token secreto devolvido apenas via host_url na criação
        - name: display_name
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "302":
          description: Cookie de host definido; redirect para a lobby `/m/{slug}`
        "403":
          description: Token inválido
        "404":
          description: Reunião não encontrada
        "410":
          description: Reunião já encerrada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token gerado em Admin → API (ou MEET_MCP_TOKEN)

  schemas:
    PaintStop:
      type: object
      required: [color, at]
      properties:
        color:
          type: string
          example: "#10b981"
        at:
          type: number
          minimum: 0
          maximum: 100
          description: Posição do stop (0–100)

    PaintGradient:
      type: object
      required: [type, angle, stops]
      properties:
        type:
          type: string
          enum: [linear, radial]
        angle:
          type: number
          minimum: 0
          maximum: 360
        stops:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: "#/components/schemas/PaintStop"

    PaintToken:
      type: object
      nullable: true
      required: [mode, solid]
      properties:
        mode:
          type: string
          enum: [solid, gradient]
        solid:
          type: string
          description: Cor sólida (também fallback quando mode=gradient)
          example: "#0ea5e9"
        gradient:
          $ref: "#/components/schemas/PaintGradient"

    BrandIdentity:
      type: object
      description: |
        Tab Identidade. Todos os campos são opcionais.
        Defaults: lobby_title/wordmark = nome da sala ou título da reunião;
        lobby_subtitle = "Powered by OpenMeet"; logo_url = null.
      properties:
        lobby_title:
          type: string
          description: Título mostrado no lobby
        lobby_subtitle:
          type: string
          description: Subtítulo do lobby (default "Powered by OpenMeet")
        logo_url:
          type: string
          nullable: true
          description: URL absoluta http(s) ou caminho relativo (/brand-assets/…)
        wordmark:
          type: string
          nullable: true
          maxLength: 120
          description: Texto exibido quando não há logo

    BrandPalette:
      type: object
      description: |
        Tab Paleta. Todos os campos são opcionais.
        Default theme_preset = sky (#0ea5e9 / #38bdf8 / #818cf8, fundo #0b1020).
        Se só theme_preset for enviado, as cores do preset são aplicadas.
      properties:
        theme_preset:
          type: string
          enum: [sky, violet, indigo, emerald, rose, amber]
          description: Preset de tema (default sky)
          default: sky
        primary_color:
          type: string
          example: "#0ea5e9"
        secondary_color:
          type: string
          example: "#38bdf8"
        tertiary_color:
          type: string
          example: "#818cf8"
        background:
          type: string
          example: "#0b1020"
          description: Fundo sólido (default #0b1020)
        primary_paint:
          $ref: "#/components/schemas/PaintToken"
        secondary_paint:
          $ref: "#/components/schemas/PaintToken"
        tertiary_paint:
          $ref: "#/components/schemas/PaintToken"
        background_paint:
          $ref: "#/components/schemas/PaintToken"
        pattern_url:
          type: string
          nullable: true
          description: URL do padrão de fundo
        pattern_size_mode:
          type: string
          nullable: true
          enum: [percent, fixed]
          default: percent
        pattern_size:
          type: integer
          nullable: true
          minimum: 1
          maximum: 512
          default: 24
        pattern_tint:
          type: string
          nullable: true
          enum: [none, primary, secondary, tertiary, custom]
          default: none
        pattern_tint_color:
          type: string
          nullable: true
        pattern_tint_opacity:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          default: 55
        bg_animation:
          type: string
          nullable: true
          enum: [none, wave, beam, aurora, pulse]
          default: none
        bg_animation_speed:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          default: 3

    BrandAdvanced:
      type: object
      description: |
        Tab Avançado. Todos os campos são opcionais.
        Default font_family = "Inter, system-ui, sans-serif".
      properties:
        font_family:
          type: string
          example: "Inter, system-ui, sans-serif"
          default: "Inter, system-ui, sans-serif"
        favicon_url:
          type: string
          nullable: true
        custom_css:
          type: string
          nullable: true
          description: CSS injetado na página da sala/reunião

    BrandPublic:
      type: object
      description: Marca aplicada (resposta), agrupada como nas tabs do editor
      properties:
        identity:
          $ref: "#/components/schemas/BrandIdentity"
        palette:
          $ref: "#/components/schemas/BrandPalette"
        advanced:
          $ref: "#/components/schemas/BrandAdvanced"

    BrandUiLegacy:
      type: object
      description: |
        Alias legado camelCase (compatibilidade). Preferir identity / palette / advanced.
        Aceita os mesmos campos internos (logoUrl, themePreset, etc.).
      additionalProperties: true

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome de identificação do template (não é o título da reunião)
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 2
          maxLength: 64
          description: Slug opcional; gerado automaticamente se omitido
        access_policy:
          type: string
          enum: [public, members, invite]
          default: public
        board_id:
          type: string
        owner_identity_id:
          type: string
          format: uuid
          description: UUID interno do owner (utilizador OpenMeet)
        owner_user_id:
          type: string
          format: uuid
          description: Alias de owner_identity_id
        external_id:
          type: string
          description: |
            ID externo do utilizador na plataforma parceira. Se omitido
            (com token de Admin), usa o admin que gerou o token.
        identity:
          $ref: "#/components/schemas/BrandIdentity"
        palette:
          $ref: "#/components/schemas/BrandPalette"
        advanced:
          $ref: "#/components/schemas/BrandAdvanced"
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"

    CreateRoomResponse:
      type: object
      required: [room_id, name, slug, url, join_path]
      properties:
        room_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        url:
          type: string
          format: uri
          description: URL do template (/r/{slug})
        join_path:
          type: string
          example: /r/x7k9m2pqab
        access_policy:
          type: string
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        brand:
          $ref: "#/components/schemas/BrandPublic"

    CreateMeetingFromRoomRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Título da reunião (obrigatório — definido pela plataforma)
        access_policy:
          type: string
          enum: [public, members, invite]
          description: Se omitido, herda da sala
        board_id:
          type: string
        empty_timeout_sec:
          type: integer
          minimum: 60
          maximum: 86400
          description: |
            Segundos após o último participante sair até a sala LiveKit terminar.
            Omitir para usar o default do servidor (LIVEKIT_EMPTY_TIMEOUT_SEC).
        redirect_after_meet:
          type: string
          format: uri
          nullable: true
          description: URL http(s) absoluta para onde enviar o utilizador após leave/end
        external_invite_url:
          $ref: "#/components/schemas/ExternalInviteUrl"
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        wait_for_host:
          type: boolean
          description: |
            Se true, participantes ficam na lobby até existir um anfitrião na sala.
            Por omissão true quando access_policy=invite.

    CreateInstantMeetingRequest:
      type: object
      properties:
        title:
          type: string
          description: Título da reunião (default = "Instant YYYY-MM-DD HH:mm")
        access_policy:
          type: string
          enum: [public, members, invite]
          default: public
        board_id:
          type: string
        room_id:
          type: string
          format: uuid
          description: |
            Legado — copia marca de uma sala. Preferir
            POST /api/v1/rooms/{room_id}/meetings.
        owner_identity_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        external_id:
          type: string
          description: ID externo do owner; omitível com token Admin (default = admin gerador)
        empty_timeout_sec:
          type: integer
          minimum: 60
          maximum: 86400
          description: |
            Segundos após o último participante sair até a sala LiveKit terminar.
            Omitir para usar o default do servidor (LIVEKIT_EMPTY_TIMEOUT_SEC,
            tipicamente 300).
        redirect_after_meet:
          type: string
          format: uri
          nullable: true
          description: URL http(s) absoluta para retorno pós-reunião
        external_invite_url:
          $ref: "#/components/schemas/ExternalInviteUrl"
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        wait_for_host:
          type: boolean
          description: |
            Manter participantes na sala de espera até o anfitrião entrar.
            Default true quando access_policy=invite.
        identity:
          $ref: "#/components/schemas/BrandIdentity"
        palette:
          $ref: "#/components/schemas/BrandPalette"
        advanced:
          $ref: "#/components/schemas/BrandAdvanced"
        ui:
          $ref: "#/components/schemas/BrandUiLegacy"

    CreateMeetingResponse:
      type: object
      required: [meeting_id, slug, url, join_path]
      properties:
        meeting_id:
          type: string
          format: uuid
        slug:
          type: string
        url:
          type: string
          format: uri
          description: URL de entrada dos participantes (/m/{slug})
        join_path:
          type: string
          example: /m/x7k9m2pqab
        host_url:
          type: string
          format: uri
          nullable: true
          description: |
            URL de entrada do anfitrião (GET …/enter?token=…). Concede host
            sem conta na plataforma de videoconferência.
        host_path:
          type: string
          nullable: true
          example: /api/v1/meetings/{id}/enter?token=…
        access_policy:
          type: string
        title:
          type: string
        brand_room_id:
          type: string
          format: uuid
          nullable: true
          description: ID da sala-template usada como marca (null se instantânea pura)
        empty_timeout_sec:
          type: integer
          description: Timeout efetivo de sala vazia em segundos
        redirect_after_meet:
          type: string
          format: uri
          nullable: true
        external_invite_url:
          $ref: "#/components/schemas/ExternalInviteUrl"
        webhook_url:
          $ref: "#/components/schemas/WebhookUrl"
        wait_for_host:
          type: boolean
          description: Participantes aguardam o anfitrião na lobby

    WebhookUrl:
      type: string
      format: uri
      nullable: true
      maxLength: 2000
      description: |
        URL http(s) absoluta para onde enviar os artefatos da reunião
        (resumo, transcrição completa, tarefas e link da gravação).
        Não é redirect de browser — isso é `redirect_after_meet`.

    ExternalInviteUrl:
      type: string
      format: uri
      nullable: true
      maxLength: 2000
      description: |
        URL http(s) absoluta copiada pela ação de convite dentro da reunião.
        Se omitida ou null, o OpenMeet copia a URL atual da reunião.

    WebhookMeetingMeta:
      type: object
      required: [id, roomSlug, roomTitle, startedAt]
      properties:
        id:
          type: string
          format: uuid
        roomSlug:
          type: string
          description: Slug da reunião (`/m/{slug}`)
        roomTitle:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    WebhookEnvelope:
      type: object
      required: [event, version, sentAt, meeting, data]
      description: Envelope comum de todos os POSTs outbound
      properties:
        event:
          type: string
          enum:
            - transcript.ready
            - chat.ready
            - summary.ready
            - tasks.generated
            - recording.ready
            - attendance.ready
        version:
          type: integer
          enum: [1]
        sentAt:
          type: string
          format: date-time
        meeting:
          $ref: "#/components/schemas/WebhookMeetingMeta"
        data:
          type: object
          additionalProperties: true

    WebhookTranscriptReady:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          properties:
            event:
              type: string
              enum: [transcript.ready]
            data:
              type: object
              required: [segments]
              properties:
                segments:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      speakerLabel:
                        type: string
                      text:
                        type: string
                      isFinal:
                        type: boolean
                      startedAtMs:
                        type: integer
                        nullable: true
                      endedAtMs:
                        type: integer
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
          example:
            event: transcript.ready
            version: 1
            sentAt: "2026-08-04T11:30:05.000Z"
            meeting:
              id: "11111111-1111-1111-1111-111111111111"
              roomSlug: standup
              roomTitle: Standup
              startedAt: "2026-08-04T11:00:00.000Z"
              endedAt: "2026-08-04T11:30:00.000Z"
            data:
              segments:
                - id: "22222222-2222-2222-2222-222222222222"
                  speakerLabel: Ana
                  text: Vamos começar pelo status do sprint.
                  isFinal: true
                  startedAtMs: 1200
                  endedAtMs: 4100
                  createdAt: "2026-08-04T11:01:02.000Z"

    WebhookSummaryReady:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          properties:
            event:
              type: string
              enum: [summary.ready]
            data:
              type: object
              properties:
                summaryMarkdown:
                  type: string
                model:
                  type: string
                  nullable: true
          example:
            event: summary.ready
            version: 1
            sentAt: "2026-08-04T11:30:05.000Z"
            meeting:
              id: "11111111-1111-1111-1111-111111111111"
              roomSlug: standup
              roomTitle: Standup
              startedAt: "2026-08-04T11:00:00.000Z"
              endedAt: "2026-08-04T11:30:00.000Z"
            data:
              summaryMarkdown: |
                ## Principais pontos
                - Status do sprint alinhado
              model: gemini-3.5-flash-lite

    WebhookTasksGenerated:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          properties:
            event:
              type: string
              enum: [tasks.generated]
            data:
              type: object
              properties:
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      assigneeHint:
                        type: string
                        nullable: true
                      status:
                        type: string
                      priority:
                        type: string
                      dueDateHint:
                        type: string
                      description:
                        type: string
                      checklist:
                        type: array
                        items:
                          type: string
          example:
            event: tasks.generated
            version: 1
            sentAt: "2026-08-04T11:30:05.000Z"
            meeting:
              id: "11111111-1111-1111-1111-111111111111"
              roomSlug: standup
              roomTitle: Standup
              startedAt: "2026-08-04T11:00:00.000Z"
              endedAt: "2026-08-04T11:30:00.000Z"
            data:
              tasks:
                - id: "77777777-7777-7777-7777-777777777777"
                  title: Publicar release notes
                  assigneeHint: Caio
                  status: pending
                  priority: medium

    WebhookRecordingReady:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          properties:
            event:
              type: string
              enum: [recording.ready]
            data:
              type: object
              properties:
                recordingId:
                  type: string
                  format: uuid
                status:
                  type: string
                engine:
                  type: string
                storageBackend:
                  type: string
                mimeType:
                  type: string
                  nullable: true
                bytes:
                  type: integer
                  nullable: true
                downloadPath:
                  type: string
                  description: |
                    Caminho relativo do ficheiro. O GET aceita o Bearer da API
                    pública (o mesmo token de `POST /api/v1/rooms`) ou sessão
                    do owner/host. Com `?download=1` a resposta vai como
                    attachment.
                startedAt:
                  type: string
                  format: date-time
                  nullable: true
                endedAt:
                  type: string
                  format: date-time
                  nullable: true
          example:
            event: recording.ready
            version: 1
            sentAt: "2026-08-04T11:30:05.000Z"
            meeting:
              id: "11111111-1111-1111-1111-111111111111"
              roomSlug: standup
              roomTitle: Standup
              startedAt: "2026-08-04T11:00:00.000Z"
              endedAt: "2026-08-04T11:30:00.000Z"
            data:
              recordingId: "88888888-8888-8888-8888-888888888888"
              status: ready
              engine: browser
              storageBackend: local
              mimeType: video/webm
              bytes: 12345678
              downloadPath: /api/meetings/11111111-1111-1111-1111-111111111111/recording/88888888-8888-8888-8888-888888888888/file

    WebhookAttendanceReady:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          properties:
            event:
              type: string
              enum: [attendance.ready]
            data:
              type: object
              required: [attendees, presentCount, meetingStartedAt]
              properties:
                attendees:
                  type: array
                  items:
                    type: object
                    required:
                      [displayName, role, joinedAt, leftAt, durationMs, sessions]
                    properties:
                      displayName:
                        type: string
                      role:
                        type: string
                        enum: [host, participant]
                      identityId:
                        type: string
                        format: uuid
                        nullable: true
                      joinedAt:
                        type: string
                        format: date-time
                      leftAt:
                        type: string
                        format: date-time
                        nullable: true
                      durationMs:
                        type: integer
                        nullable: true
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            joinedAt:
                              type: string
                              format: date-time
                            leftAt:
                              type: string
                              format: date-time
                              nullable: true
                presentCount:
                  type: integer
                meetingStartedAt:
                  type: string
                  format: date-time
                meetingEndedAt:
                  type: string
                  format: date-time
                  nullable: true
          example:
            event: attendance.ready
            version: 1
            sentAt: "2026-08-04T11:30:05.000Z"
            meeting:
              id: "11111111-1111-1111-1111-111111111111"
              roomSlug: standup
              roomTitle: Standup
              startedAt: "2026-08-04T11:00:00.000Z"
              endedAt: "2026-08-04T11:30:00.000Z"
            data:
              attendees:
                - displayName: Ana
                  role: host
                  identityId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                  joinedAt: "2026-08-04T11:00:05.000Z"
                  leftAt: "2026-08-04T11:30:00.000Z"
                  durationMs: 1795000
                  sessions:
                    - joinedAt: "2026-08-04T11:00:05.000Z"
                      leftAt: "2026-08-04T11:30:00.000Z"
              presentCount: 1
              meetingStartedAt: "2026-08-04T11:00:00.000Z"
              meetingEndedAt: "2026-08-04T11:30:00.000Z"


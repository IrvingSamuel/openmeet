# OpenMeet — LiveKit SFU
# Uses host networking so UDP media works correctly on the VPS.
#
# TLS certs (optional for TURN): set LIVEKIT_TLS_CERT / LIVEKIT_TLS_KEY to
# absolute paths on the host, or edit infra/livekit.yaml for your domain.

services:
  livekit:
    # v1.8.4 rejects client 2.18+ `_data_track` DC → CLIENT_REQUEST_LEAVE loop ~15s
    image: livekit/livekit-server:v1.13.4
    container_name: openmeet-livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - ${LIVEKIT_TLS_CERT:-./certs/livekit.crt}:/etc/livekit/certs/livekit.crt:ro
      - ${LIVEKIT_TLS_KEY:-./certs/livekit.key}:/etc/livekit/certs/livekit.key:ro
    environment:
      - LIVEKIT_CONFIG=
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

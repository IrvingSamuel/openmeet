# Optional LiveKit Egress: room composite recording (MP4) and live streaming
# to YouTube / RTMP (spectator view, see docs/05-live-stream.md).
# Heavy (Chrome headless) — each recording or stream uses ~4 vCPU.
# Only run it on servers with spare CPU (or a dedicated node); see ADR-002.
#
# Start:
#   docker compose -f infra/docker-compose.egress.yml up -d
# Stop:
#   docker compose -f infra/docker-compose.egress.yml down
#
# Live streaming pushes RTMP out on TCP 1935 (rtmps: 443) — allow egress traffic.
# Prefer /admin storage = S3 (MinIO on this host) over local disk for egress output.
# SYS_ADMIN is required since egress v1.7.6 for Chrome sandbox.

services:
  egress:
    image: livekit/egress:v1.9.1
    container_name: chronos-meet-egress
    restart: unless-stopped
    network_mode: host
    # Required for Chrome after egress v1.7.6
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ${RECORDINGS_DIR:-/var/chronos-meet/recordings}:/var/chronos-meet/recordings
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
